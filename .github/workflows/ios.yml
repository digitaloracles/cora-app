name: iOS

on:
  push:
    branches: [main, "buzz/**"]
    paths: ["ios/**", "Sources/CoraKit/**", "Package.swift", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      language:
        description: Language of the simulator screenshots
        type: choice
        options: [it, en]
        default: it

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build -project ios/CoraiOS.xcodeproj -scheme Cora -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
      - name: Screenshots with sample data
        env:
          SHOT_LANGUAGE: ${{ inputs.language || 'it' }}
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(x) for x in re.findall(r"\d+", k)], reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if re.match(r"iPhone \d+ Pro$", d["name"])))')
          echo "Simulator $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$DEVICE" build/sim/Build/Products/Debug-iphonesimulator/Cora.app
          mkdir -p build/screenshots
          shot() {
            name=$1; shift
            xcrun simctl terminate "$DEVICE" space.usecora.ios 2>/dev/null || true
            env SIMCTL_CHILD_CORA_DEMO=1 "$@" xcrun simctl launch "$DEVICE" space.usecora.ios -AppleLanguages "($SHOT_LANGUAGE)" -AppleLocale "${SHOT_LANGUAGE}_$([ "$SHOT_LANGUAGE" = en ] && echo US || echo IT)"
            sleep 6
            xcrun simctl io "$DEVICE" screenshot "build/screenshots/$name.png"
          }
          shot 1-agents SIMCTL_CHILD_CORA_DEMO_TAB=agents
          shot 2-agent SIMCTL_CHILD_CORA_DEMO_TAB=agents SIMCTL_CHILD_CORA_DEMO_AGENT=ag_buzz
          shot 3-subscriptions SIMCTL_CHILD_CORA_DEMO_TAB=subscriptions
          shot 4-threads SIMCTL_CHILD_CORA_DEMO_TAB=threads
          shot 5-spaces SIMCTL_CHILD_CORA_DEMO_TAB=spaces
          shot 6-plans SIMCTL_CHILD_CORA_DEMO_TAB=plans
          shot 7-plan SIMCTL_CHILD_CORA_DEMO_TAB=plans SIMCTL_CHILD_CORA_DEMO_PLAN=plan_buzz SIMCTL_CHILD_CORA_DEMO_PLAN_ITEM=plan_buzz/item_3
          shot 8-thread SIMCTL_CHILD_CORA_DEMO_TAB=threads SIMCTL_CHILD_CORA_DEMO_THREAD=1000000000000000001
          shot 9-questions SIMCTL_CHILD_CORA_DEMO_TAB=agents SIMCTL_CHILD_CORA_DEMO_QUESTIONS=1
          shot 10-thread-question SIMCTL_CHILD_CORA_DEMO_TAB=threads SIMCTL_CHILD_CORA_DEMO_THREAD=1000000000000000001 SIMCTL_CHILD_CORA_DEMO_QUESTIONS=1
          xcrun simctl terminate "$DEVICE" space.usecora.ios 2>/dev/null || true
          xcrun simctl launch "$DEVICE" space.usecora.ios -AppleLanguages "($SHOT_LANGUAGE)" -AppleLocale "${SHOT_LANGUAGE}_$([ "$SHOT_LANGUAGE" = en ] && echo US || echo IT)"
          sleep 6
          xcrun simctl io "$DEVICE" screenshot build/screenshots/0-connect.png
          ls -la build/screenshots
      - name: Live rows stay still (bursts of frames while an agent works)
        env:
          SHOT_LANGUAGE: ${{ inputs.language || 'it' }}
        run: |
          DEVICE=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; print(next(d["udid"] for v in json.load(sys.stdin)["devices"].values() for d in v))')
          mkdir -p build/screenshots/bursts
          burst() {
            name=$1; shift
            xcrun simctl terminate "$DEVICE" space.usecora.ios 2>/dev/null || true
            env SIMCTL_CHILD_CORA_DEMO=1 "$@" xcrun simctl launch "$DEVICE" space.usecora.ios -AppleLanguages "($SHOT_LANGUAGE)" -AppleLocale "${SHOT_LANGUAGE}_$([ "$SHOT_LANGUAGE" = en ] && echo US || echo IT)"
            sleep 5
            for i in 01 02 03 04 05 06 07 08 09 10 11 12; do
              xcrun simctl io "$DEVICE" screenshot "build/screenshots/bursts/$name-$i.png" >/dev/null 2>&1
              sleep 0.15
            done
          }
          burst agents SIMCTL_CHILD_CORA_DEMO_TAB=agents
          burst threads SIMCTL_CHILD_CORA_DEMO_TAB=threads
          burst thread SIMCTL_CHILD_CORA_DEMO_TAB=threads SIMCTL_CHILD_CORA_DEMO_THREAD=1000000000000000001
          burst plans SIMCTL_CHILD_CORA_DEMO_TAB=plans
          burst plans-change SIMCTL_CHILD_CORA_DEMO_TAB=plans SIMCTL_CHILD_CORA_DEMO_CHANGE=1
          burst agents-change SIMCTL_CHILD_CORA_DEMO_TAB=agents SIMCTL_CHILD_CORA_DEMO_CHANGE=1
          ls build/screenshots/bursts | wc -l
      - name: Tapping a notification opens its screen (UI test on the simulator)
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; print(next(d["udid"] for v in json.load(sys.stdin)["devices"].values() for d in v))')
          xcrun simctl terminate "$DEVICE" space.usecora.ios 2>/dev/null || true
          xcodebuild build-for-testing -project ios/CoraiOS.xcodeproj -scheme Cora -configuration Debug -destination "id=$DEVICE" \
            -derivedDataPath build/uitest CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            > build/uitest-build.log 2>&1 || { grep -E "error:" build/uitest-build.log | head -20; tail -40 build/uitest-build.log; exit 65; }
          test -f build/uitest/Build/Products/Debug-iphonesimulator/Cora.app/Info.plist
          XCTESTRUN=$(ls build/uitest/Build/Products/*.xctestrun | head -1)
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "id=$DEVICE" -resultBundlePath build/NoticeTaps.xcresult \
            > build/uitest.log 2>&1 || { tail -80 build/uitest.log; xcrun xcresulttool get test-results summary --path build/NoticeTaps.xcresult || true; exit 65; }
          grep -E "Test (Case|Suite)" build/uitest.log | tail -30
          xcrun xcresulttool get test-results summary --path build/NoticeTaps.xcresult || true
      - name: Crash reports and log of the app during the notification taps
        if: always()
        run: |
          mkdir -p build/screenshots/diagnostics
          find ~/Library/Logs/DiagnosticReports -newer ios/project.yml \( -iname '*Cora*' -o -iname '*.ips' \) -exec cp {} build/screenshots/diagnostics/ \; 2>/dev/null || true
          ls -la build/screenshots/diagnostics
          for f in build/screenshots/diagnostics/*Cora*; do [ -f "$f" ] && head -c 6000 "$f"; done || true
          xcrun simctl spawn booted log show --last 30m --style compact --predicate 'process == "Cora" AND (messageType == error OR messageType == fault OR eventMessage CONTAINS[c] "crash" OR eventMessage CONTAINS[c] "terminat")' > build/screenshots/diagnostics/cora-log.txt 2>&1 || true
          xcrun simctl spawn booted log show --last 30m --style compact --predicate 'eventMessage CONTAINS[c] "space.usecora.ios" AND (eventMessage CONTAINS[c] "terminat" OR eventMessage CONTAINS[c] "watchdog" OR eventMessage CONTAINS[c] "crash" OR eventMessage CONTAINS[c] "exited")' > build/screenshots/diagnostics/system-log.txt 2>&1 || true
          tail -60 build/screenshots/diagnostics/system-log.txt
      - name: Screenshots of the notification taps
        if: always()
        run: |
          mkdir -p build/screenshots/notices
          xcrun xcresulttool export attachments --path build/NoticeTaps.xcresult --output-path build/screenshots/notices || true
          ls -la build/screenshots/notices | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: build/screenshots
          if-no-files-found: warn

  device:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.language != 'en' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Install the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Install the CI development certificate
        env:
          IOS_DEV_P12: ${{ secrets.IOS_DEV_P12 }}
          IOS_DEV_P12_PASSWORD: ${{ secrets.IOS_DEV_P12_PASSWORD }}
        run: |
          # One persistent certificate, so a run does not create (and use up) a new one on the team.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$IOS_DEV_P12" | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security import "$RUNNER_TEMP/dev.p12" -k "$KEYCHAIN" -P "$IOS_DEV_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dev.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
      - name: Archive and export a development build
        run: |
          set -o pipefail
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project ios/CoraiOS.xcodeproj -scheme Cora -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Cora.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${AUTH[@]}" 2>&1 | tail -60
          sed "s/TEAM_ID/$TEAM_ID/" ios/Config/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath build/Cora.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export "${AUTH[@]}" 2>&1 | tail -40
          ls -la build/export
      - name: Check the signature and the devices
        run: |
          mkdir -p build/check && cd build/check
          unzip -q ../export/Cora.ipa
          APP=Payload/Cora.app
          codesign --verify --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier'
          security cms -D -i "$APP/embedded.mobileprovision" > profile.plist
          /usr/libexec/PlistBuddy -c 'Print :Name' -c 'Print :ExpirationDate' -c 'Print :Entitlements:application-identifier' profile.plist
          /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' profile.plist | sed 's/^/device /'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' "$APP/Info.plist" | tee ../export/bundle.txt
      - name: Remove the keys
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: Cora-iOS
          path: |
            build/export/Cora.ipa
            build/export/bundle.txt
          if-no-files-found: error
