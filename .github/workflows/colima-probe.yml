name: Colima probe
on:
  push:
    branches: ["buzz/not120-colima-probe"]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Machine
        run: |
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string; sysctl kern.hv_support || true; sysctl -n hw.memsize; sysctl -n hw.ncpu
      - name: Tools
        run: |
          A=$(uname -m); L=$([ "$A" = arm64 ] && echo arm64 || echo x86_64); D=$([ "$A" = arm64 ] && echo aarch64 || echo x86_64)
          mkdir -p $HOME/t/bin && cd $HOME/t
          curl -fsSL -o bin/colima https://github.com/abiosoft/colima/releases/download/v0.10.3/colima-Darwin-$L && chmod +x bin/colima
          curl -fsSL https://github.com/lima-vm/lima/releases/download/v2.3.0/lima-2.3.0-Darwin-$L.tar.gz | tar -xz
          curl -fsSL https://download.docker.com/mac/static/stable/$D/docker-29.10.1.tgz | tar -xz --strip-components 1 -C bin docker/docker
          ls bin share/lima | head -30
      - name: Colima vz
        run: |
          export PATH=$HOME/t/bin:$PATH COLIMA_HOME=$HOME/.cora-local/colima
          time colima start cora --vm-type vz --cpu 2 --memory 4 --disk 30 --runtime docker 2>&1 | tail -30 || echo VZ_FAILED
          export DOCKER_HOST=unix://$COLIMA_HOME/cora/docker.sock
          docker info --format '{{.ServerVersion}} {{.Architecture}}' && time docker run --rm -p 127.0.0.1:18080:80 -d --name web nginx:alpine && sleep 3 && curl -sS -o /dev/null -w 'host->container %{http_code}\n' http://127.0.0.1:18080 || true
          colima stop cora || true
      - name: Colima qemu
        if: always()
        run: |
          brew install qemu >/dev/null 2>&1 || true
          export PATH=$HOME/t/bin:$PATH COLIMA_HOME=$HOME/.cora-local/colima2
          time colima start q --vm-type qemu --cpu 2 --memory 4 --disk 30 --runtime docker 2>&1 | tail -30 || echo QEMU_FAILED
          export DOCKER_HOST=unix://$COLIMA_HOME/q/docker.sock
          docker info --format '{{.ServerVersion}} {{.Architecture}}' && time docker run --rm alpine uname -a || true
