name: Colima probe
on:
  push:
    branches: ["buzz/not120-colima-probe"]
jobs:
  probe:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: digitaloracles/cora
          path: cora
      - name: Tools
        run: |
          mkdir -p $HOME/t/bin && cd $HOME/t
          curl -fsSL -o bin/colima https://github.com/abiosoft/colima/releases/download/v0.10.3/colima-Darwin-x86_64 && chmod +x bin/colima
          curl -fsSL https://github.com/lima-vm/lima/releases/download/v2.3.0/lima-2.3.0-Darwin-x86_64.tar.gz | tar -xz
          curl -fsSL https://download.docker.com/mac/static/stable/x86_64/docker-29.10.1.tgz | tar -xz --strip-components 1 -C bin docker/docker
      - name: VM
        run: |
          export PATH=$HOME/t/bin:/usr/bin:/bin:/usr/sbin:/sbin COLIMA_HOME=$HOME/.cora-local/colima LIMA_HOME=$HOME/.cora-local/lima DOCKER_CONFIG=$HOME/.cora-local/docker
          time colima start cora --vm-type vz --cpu 2 --memory 6 --disk 40 --runtime docker --activate=false 2>&1 | tail -5
          colima status cora --json; ls -la $HOME/.cora-local/colima $HOME/.cora-local/colima/cora || true; cat ~/.docker/config.json 2>/dev/null || echo "no ~/.docker/config.json"
          time colima start cora --activate=false 2>&1 | tail -3; echo "second start exit $?"
      - name: Box
        run: |
          export PATH=$HOME/t/bin:/usr/bin:/bin:/usr/sbin:/sbin COLIMA_HOME=$HOME/.cora-local/colima LIMA_HOME=$HOME/.cora-local/lima DOCKER_CONFIG=$HOME/.cora-local/docker
          export DOCKER_HOST="unix://$(colima status cora --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["docker_socket"].replace("unix://",""))')"
          echo "DOCKER_HOST=$DOCKER_HOST"
          docker info --format '{{.ServerVersion}} {{.Architecture}} {{.NCPU}} {{.MemTotal}}'
          time docker build -q -t cora-box:latest cora/box
          docker network create cora-desktops >/dev/null
          time docker run -d --name cora-box-probe --network cora-desktops --memory 2g -p 127.0.0.1::6080 cora-box:latest
          sleep 20; docker port cora-box-probe
          P=$(docker port cora-box-probe 6080 | head -1 | cut -d: -f2)
          for i in $(seq 1 20); do curl -fsS -o /dev/null -w "novnc from the Mac %{http_code}\n" http://127.0.0.1:$P/ && break; sleep 3; done
          docker exec -u agent cora-box-probe sh -c 'uname -a; cat /etc/debian_version; whoami; chromium --version'
          docker images cora-box --format '{{.Size}}'
