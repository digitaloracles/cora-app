name: CoraiOS
options:
  bundleIdPrefix: space.usecora
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CoraApp:
    path: ..
targets:
  # Not "Cora": the package's macOS executable has that name, and the UI tests would look for it instead of the app.
  CoraiOS:
    type: application
    platform: iOS
    sources: [Cora]
    dependencies:
      - package: CoraApp
        product: CoraKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.usecora.ios
        PRODUCT_NAME: Cora
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cora
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Cora/Cora.entitlements
    info:
      path: Cora/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it]
        CFBundleURLTypes:
          - CFBundleURLName: space.usecora.ios.connect
            CFBundleURLSchemes: [cora]
  CoraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CoraUITests]
    dependencies:
      - target: CoraiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.usecora.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CoraiOS
schemes:
  Cora:
    build:
      targets:
        CoraiOS: all
        CoraUITests: [test]
    test:
      targets: [CoraUITests]
